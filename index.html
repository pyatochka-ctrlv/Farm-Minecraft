<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Магічна ферма: агент будує загін</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --pix:"Press Start 2P","Segoe UI",Arial,sans-serif;
  --mc:"Segoe UI","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#1a120b}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;color:#fff;display:flex;flex-direction:column;
  font-family:var(--pix);font-size:16px;line-height:1.45;font-synthesis:none;user-select:none;-webkit-user-select:none;overflow:hidden;
  background-color:#3b2a1c;background-size:96px 96px;image-rendering:pixelated}
button{font-family:inherit}
.hidden{display:none!important}

/* ---------- кнопки в стилі меню Minecraft ---------- */
.mcb{font-family:var(--pix);font-size:18px;font-weight:600;color:#fff;text-shadow:3px 3px 0 #3f3f3f;background:#7a7a7a;
  border:3px solid #000;border-radius:0;box-shadow:inset 3px 3px 0 #b9b9b9,inset -3px -4px 0 #494949;
  padding:8px 22px 10px;cursor:pointer;white-space:nowrap;line-height:1.1}
.mcb:hover:not(:disabled){color:#ffffa0;background:#878787}
.mcb:active:not(:disabled){box-shadow:inset 3px 4px 0 #494949,inset -3px -3px 0 #a5a5a5;transform:translateY(2px)}
.mcb:disabled{color:#a8a8a8;text-shadow:2px 2px 0 #2c2c2c;background:#555;box-shadow:inset 3px 3px 0 #6c6c6c,inset -3px -4px 0 #363636;cursor:default}
.mcb.green{background:#3c8527;box-shadow:inset 3px 3px 0 #6dc449,inset -3px -4px 0 #1d4d12}
.mcb.green:hover:not(:disabled){background:#479a30}
.mcb.green:active:not(:disabled){box-shadow:inset 3px 4px 0 #1d4d12,inset -3px -3px 0 #5fb83a}
.mcb.green:disabled{background:#3f5a36;box-shadow:inset 3px 3px 0 #587a4c,inset -3px -4px 0 #263a20}
.mcb.small{font-size:13px;padding:7px 12px 8px}
.mcb.big{font-size:22px;padding:13px 24px 14px}
.mcb.armed{background:#a33a2a;box-shadow:inset 3px 3px 0 #d8705e,inset -3px -4px 0 #5a1a10}

/* ---------- панелі як GUI Minecraft ---------- */
.gui{background:#c6c6c6;border:4px solid #000;box-shadow:inset 4px 4px 0 #fff,inset -4px -4px 0 #555;color:#3f3f3f}
.ghead{font-size:18px;color:#3f3f3f;padding:8px 14px 4px}

/* ---------- верхня панель ---------- */
#topbar{height:76px;flex:none;display:flex;align-items:center;gap:16px;padding:0 14px;background:#2b2b2b;
  border-bottom:4px solid #000;box-shadow:inset 0 -4px 0 #555,inset 0 4px 0 #6a6a6a}
.brand{font-size:18px;font-weight:700;color:#7fe05a;text-shadow:3px 3px 0 #1b4a10;white-space:nowrap}
#lvlTitle{font-size:18px;font-weight:700;text-shadow:3px 3px 0 #3f3f3f;white-space:nowrap;margin-left:10px}
#lvlTitle span{color:#ffd84a}
#prog{display:flex;gap:10px;margin-left:16px}
.em{width:46px;height:46px;cursor:pointer;filter:grayscale(1) brightness(.55);transition:filter .3s,transform .3s}
.em svg{width:100%;height:100%;display:block}
.em.cur{filter:grayscale(.2) brightness(.95);transform:translateY(-3px);animation:embob 1s ease-in-out infinite alternate}
.em.done{filter:drop-shadow(0 0 8px #41ff8a) drop-shadow(0 0 3px #b8ffd3)}
.em.done.cur{filter:drop-shadow(0 0 10px #41ff8a)}
@keyframes embob{from{transform:translateY(-4px)}to{transform:translateY(2px)}}
.spacer{flex:1}
#answerBtn{margin-left:22px;opacity:.75}

/* ---------- завдання: дерев'яна табличка з пергаментом ---------- */
#taskWrap{flex:none;margin:10px 12px 0;padding:8px;border:4px solid #000;
  background:repeating-linear-gradient(180deg,#a5733f 0 20px,#8c5e30 20px 24px,#7a4f26 24px 26px);
  box-shadow:inset 3px 3px 0 #c89458,inset -3px -3px 0 #4e3116}
#task{display:flex;gap:18px;background:#f4e4b6;color:#2c1d0c;padding:10px 20px 12px;border:4px solid #5b3a18;
  box-shadow:inset 0 0 0 3px #e2cb8e;min-height:168px}
#tMain{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
#tTitle{font-size:22px;line-height:1.5}
#tSteps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.step{display:flex;gap:10px;align-items:flex-start;font-size:17px;line-height:1.5}
.step b{flex:none;width:38px;height:38px;display:flex;align-items:center;justify-content:center;background:#7a4f26;color:#fff;
  border:3px solid #2c1d0c;font-size:16px;margin-top:-2px}
#tCheck{font-size:17px;color:#245c12;line-height:1.5}
#gBox{display:flex;flex-direction:column;gap:6px}
#gTrack{display:flex;align-items:center;gap:8px;font-size:14px}
.gst{display:flex;align-items:center;gap:8px;padding:4px 12px 6px;border:3px solid #a07a48;background:#ead6a0;color:#8a6a3c;transition:transform .2s}
.gst b{width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:#b08850;color:#fff;border:2px solid #5b3a18;font-weight:normal}
.gst.cur{background:#ffd84a;color:#2c1d0c;border-color:#2c1d0c;transform:scale(1.07)}
.gst.cur b{background:#d83b01}
.gst.done{background:#c6e6ae;color:#245c12;border-color:#245c12}
.gst.done b{background:#3c8527}
.garr{color:#7a4f26;font-size:18px}
#gQ{font-size:23px;line-height:1.55;margin-top:8px}
#gSub{font-size:15px;line-height:1.5;color:#6b4a1e}
#gA{font-size:18px;line-height:1.55;color:#245c12;min-height:28px}
#gCtl{display:flex;flex-direction:column;gap:10px;align-items:stretch;justify-content:center;height:100%}
#gCtl .mcb.big{font-size:20px;padding:16px 22px 17px}
.gsmall{display:flex;gap:8px}
.gsmall .mcb{flex:1}
.choice{display:flex;align-items:center;justify-content:center;font-family:var(--pix);font-size:30px;color:#fff;text-shadow:2px 2px 0 #000;
  background:rgba(30,90,200,.8);outline:3px solid #fff;outline-offset:-3px;z-index:3;animation:pulse .7s ease-in-out infinite alternate}
.lt{font-family:var(--mc);font-weight:800;display:inline-block;min-width:1.25em;padding:0 .22em;margin:0 .06em;color:#fff;border:3px solid #000;text-align:center;text-shadow:none;line-height:1.15}
.lA{background:#d63a2f}.lB{background:#1f6fd1}.lC{background:#b8860b}
.choice.cA{background:rgba(214,58,47,.88)}.choice.cB{background:rgba(31,111,209,.88)}.choice.cC{background:rgba(184,134,11,.92)}
.choice{font-family:var(--mc);font-weight:800}
.choice{pointer-events:auto;cursor:pointer}
#gCards{position:absolute;right:16px;top:16px;bottom:16px;width:520px;display:flex;flex-direction:column;gap:14px;z-index:60;overflow:auto}
#gCards .ghd{font-size:16px;color:#ffe680;text-shadow:2px 2px 0 #000}
.gcard{position:relative;display:flex;align-items:center;gap:14px;padding:12px 14px;background:#c6c6c6;border:4px solid #000;
  box-shadow:inset 3px 3px 0 #fff,inset -3px -3px 0 #555;cursor:pointer;color:#2c2c2c;transition:opacity .2s}
.gcard:hover{box-shadow:inset 3px 3px 0 #fff,inset -3px -3px 0 #555,0 0 0 4px #ffe31a}
.gcard .lt{font-size:28px;flex:none}
.gcard .gtxt{font-size:18px;line-height:1.5}
.gcard .bhold{position:relative;flex:none}
.gcard .why{display:none;font-size:13px;line-height:1.5;color:#a01d12;margin-top:6px}
.gcard .gbody{display:flex;flex-direction:column}
.gcard.wrong{opacity:.55;border-color:#b3261e;animation:shake .5s ease}
.gcard.wrong .why{display:block}
.gcard.right{border-color:#2e8b3e;box-shadow:inset 3px 3px 0 #fff,inset -3px -3px 0 #555,0 0 0 5px #5fd33a}
.gcard.dim{opacity:.35}
.gcard.picked{box-shadow:inset 3px 3px 0 #fff,inset -3px -3px 0 #555,0 0 0 5px #4aa3ff}
.gcard.lock{cursor:default}
.blk.pend .bsvg path{stroke:#fff;stroke-width:4;stroke-dasharray:9 6;animation:dash 1s linear infinite}
.blk.pend::after{content:"?";position:absolute;right:-40px;top:6px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;
  font-family:var(--pix);font-size:18px;color:#fff;background:#1f6fd1;border:3px solid #000}
.stepnum{position:absolute;width:40px;height:40px;display:flex;align-items:flex-start;justify-content:flex-end;padding:2px 3px;font-family:var(--mc);
  font-weight:800;font-size:15px;color:#fff;text-shadow:1px 1px 0 #000,-1px -1px 0 #000;z-index:4;pointer-events:none}
.stepnum span{background:#1f6fd1;border:2px solid #000;padding:0 4px;line-height:1.3}
.tag{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:-2px;font-family:var(--mc);font-weight:700;font-size:12px;
  background:rgba(0,0,0,.7);color:#fff;padding:0 5px;white-space:nowrap;pointer-events:none}
#chatLine{position:absolute;left:10px;bottom:12px;z-index:31;background:rgba(0,0,0,.6);color:#fff;font-size:18px;padding:8px 12px 6px;
  text-shadow:2px 2px 0 #3f3f3f;transition:opacity .6s}
#chatLine.off{opacity:0}
.choice.ok{background:rgba(60,170,40,.92);animation:none;box-shadow:0 0 18px #7CFC00}
.choice.no{opacity:.22;animation:none}
.slot.pulse,.pill.pulse{animation:hl .6s ease-in-out infinite alternate}
@keyframes hl{from{box-shadow:0 0 0 0 #ffe31a}to{box-shadow:0 0 0 6px #ffe31a,0 0 22px #ffe31a}}
.mbox.wide{width:1260px}
.memo{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0 26px;text-align:center}
.memo .mc{background:#8b8b8b;border:3px solid;border-color:#373737 #fff #fff #373737;padding:12px 10px;color:#fff;text-shadow:2px 2px 0 #333}
.memo .mh{font-size:15px;line-height:1.5;margin-bottom:8px}
.memo .mb{font-family:var(--mc);font-weight:600;font-size:17px;color:#fff;background:#D83B01;border-radius:6px;padding:8px;margin:6px 0;text-shadow:none}
.memo .mb.ev{background:#0078D7}
.memo .mt{font-size:13px;line-height:1.5;margin-top:8px;color:#ffffa0}
#tSide{flex:none;display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;gap:10px}
#tBadge{font-size:15px;font-weight:700;background:#7a4f26;color:#fff;padding:6px 14px;border:3px solid #2c1d0c}
#tBadge:empty{display:none}

/* ---------- основна частина ---------- */
#main{flex:1;display:flex;gap:12px;padding:10px 12px 12px;min-height:0}
#left{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}
#lrow{flex:1;display:flex;gap:12px;min-height:0}
#sampleCol{width:500px;flex:none;display:flex;flex-direction:column;min-height:0}
#sampleArea{flex:1;margin:0 10px 10px;position:relative;overflow:hidden;background-color:#353535;border:3px solid #222;
  background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:28px 28px}
#sampleInner{position:absolute;left:0;top:0;transform-origin:0 0}
#ws{min-width:0}
#palStrip{flex:none;position:relative;background:#2e3034;border:4px solid #000;box-shadow:inset 3px 3px 0 #4a4d52,inset -3px -3px 0 #1a1b1d}
#palInner{position:relative}
#trashHint{position:absolute;inset:0;display:none;align-items:center;justify-content:center;gap:14px;background:rgba(140,25,25,.92);
  font-size:20px;z-index:40}
#palStrip.trash #trashHint{display:flex}
#ws{flex:1;min-width:0;position:relative;background:#333;border:4px solid #000;min-height:0}
#wsScroll{position:absolute;inset:0;overflow:auto}
#wsInner{position:relative;min-width:100%;min-height:100%;
  background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);
  background-size:32px 32px}
#wsHelp{font-family:var(--mc);position:absolute;right:12px;bottom:8px;padding:4px 10px;color:#bdbdbd;font-size:20px;pointer-events:none;z-index:55;background:rgba(30,30,30,.75)}
#marker{position:absolute;height:8px;width:280px;background:#fff;box-shadow:0 0 14px #fff;display:none;z-index:50}

/* ---------- блоки MakeCode ---------- */
.blk{position:absolute;cursor:grab;touch-action:none}
.blk.locked,.blk.fixed{cursor:default}
.blk .bsvg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.blk path{stroke-width:1.5;stroke-linejoin:round}
.bc{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:7px 9px;padding:15px 16px 11px 16px;min-height:54px;
  max-width:600px;width:max-content;font-family:var(--mc);font-size:20px;font-weight:600;color:#fff}
.evh{position:absolute;left:0;padding:12px 16px;min-height:52px}
#wsInner .bc{font-size:19px;max-width:470px}
.pal .bc{font-size:16px;max-width:640px;min-height:46px;padding:13px 13px 9px;gap:6px 7px}
.pal .fnum,.pal .fstr{min-width:38px;padding:2px 10px}
.pal .fitem svg{width:22px;height:22px}
.pal .ftoggle .tk{width:22px;height:22px}
.pal .ftoggle .tl{font-size:15px}
.bt{white-space:nowrap;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.field{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;cursor:pointer;font-weight:700}
.field.ro{cursor:inherit}
.fnum,.fstr{background:#fff;color:#262626;border-radius:999px;min-width:46px;justify-content:center;padding:3px 14px}
.fdrop{background:rgba(0,0,0,.25);border:1.5px solid rgba(0,0,0,.3);border-radius:999px;padding:3px 10px 3px 14px;color:#fff}
.caret{font-size:14px;opacity:.9}
.fitem{background:#fff;color:#333;border-radius:8px;padding:2px 10px 2px 6px}
.fitem svg{width:26px;height:26px;display:block}
.ftoggle{background:#7d4fc9;border-radius:999px;padding:3px;gap:4px;border:1.5px solid #5a34a0}
.ftoggle .tk{width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.4)}
.ftoggle .tl{border-radius:999px;padding:2px 12px;font-size:17px;font-weight:800;color:#fff}
.ftoggle.on .tl{background:#3cb043}
.ftoggle.off .tl{background:#9a9a9a}
.blk .field:not(.ro):hover{box-shadow:0 0 0 3px rgba(255,255,255,.65)}
.blk.run .bsvg path{stroke:#ffe31a;stroke-width:6}
.blk.run .bsvg{filter:drop-shadow(0 0 10px #ffe31a)}
.blk.glow .bsvg path{stroke:#fff;stroke-width:5;animation:glow 1s ease-in-out infinite alternate}
.blk.glow .fnum{box-shadow:0 0 0 4px #ffe31a;animation:numglow 1s ease-in-out infinite alternate}
@keyframes glow{from{stroke:#fff6a0}to{stroke:#ffffff}}
@keyframes numglow{from{box-shadow:0 0 0 3px #ffe31a}to{box-shadow:0 0 0 6px #ffe31a}}
.blk.hint .bsvg path{stroke:#fff;stroke-width:5;stroke-dasharray:12 8;animation:dash 1s linear infinite}
.blk.hint::before{content:"💡";position:absolute;left:-44px;top:6px;font-size:32px;animation:bob .7s ease-in-out infinite alternate}
.blk.wrong .bsvg path{stroke:#ff3030;stroke-width:5}
.blk.flash .bsvg path{stroke:#7CFC00;stroke-width:5}
.blk.flash .bsvg{filter:drop-shadow(0 0 8px #7CFC00)}
.blk.shake{animation:shake .5s ease}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-12px) rotate(-2deg)}40%{transform:translateX(10px) rotate(2deg)}60%{transform:translateX(-7px)}80%{transform:translateX(5px)}}
@keyframes dash{to{stroke-dashoffset:-40}}
@keyframes bob{from{transform:translateY(-4px)}to{transform:translateY(4px)}}
.blk.dsrc{opacity:.28}
.blk.sdone{opacity:.62}
.blk.snext .bsvg path{stroke:#fff;stroke-width:5;animation:glow .8s ease-in-out infinite alternate}
.blk.snext .bsvg{filter:drop-shadow(0 0 10px #fff)}
.blk.snext.pulse{animation:shake .6s ease 2}
.smark{position:absolute;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;font-family:var(--mc)}
.smark.ok{background:#3c8527;color:#fff;border:3px solid #102a08}
.smark.nx{font-size:30px;animation:bob .6s ease-in-out infinite alternate}
.ghost{position:absolute;z-index:1000;pointer-events:none;opacity:.93;filter:drop-shadow(0 10px 14px rgba(0,0,0,.55))}
.btools{position:absolute;left:100%;top:4px;display:none;padding-left:10px;gap:6px;z-index:20}
.blk:hover .btools{display:flex}
.ghost .btools{display:none!important}
.btools button{width:42px;height:42px;border:3px solid #000;background:#7a7a7a;color:#fff;font-size:22px;cursor:pointer;font-weight:800;
  box-shadow:inset 2px 2px 0 #b9b9b9,inset -2px -3px 0 #494949;font-family:var(--mc)}
.btools button:hover{color:#ffffa0}
.btools button.del{background:#a33a2a;box-shadow:inset 2px 2px 0 #d8705e,inset -2px -3px 0 #5a1a10}

/* ---------- спливаючі редактори ---------- */
.popup{position:absolute;z-index:900;padding:14px}
.numrow{display:flex;align-items:center;gap:14px;justify-content:center}
.nval{font-size:40px;font-weight:700;min-width:90px;text-align:center;color:#3f3f3f}
.quick{display:grid;grid-template-columns:repeat(5,56px);gap:8px;margin-top:12px;justify-content:center}
.quick .mcb{padding:8px 0;font-size:18px}
.quick .mcb.cur{background:#3c8527}
.popup .okb{display:block;width:100%;margin-top:12px}
.dropopt{display:flex !important;align-items:center;gap:14px;width:300px;margin:6px 0;text-align:left}
.dropopt .ar{font-size:30px;width:40px;text-align:center}
.dropopt.cur{background:#D83B01;box-shadow:inset 3px 3px 0 #ff8a55,inset -3px -4px 0 #7a2000}

/* ---------- світ ---------- */
#worldCol{width:784px;flex:none;display:flex;flex-direction:column;gap:8px}
#worldRow{display:flex;gap:10px;flex:none}
#worldFrame{flex:none;padding:12px;border:4px solid #000;
  background:repeating-linear-gradient(90deg,#a5733f 0 30px,#8c5e30 30px 34px),#a5733f;
  box-shadow:inset 3px 3px 0 #c89458,inset -3px -3px 0 #4e3116}
#world{position:relative;width:600px;height:600px;border:3px solid #2d1d0d;box-sizing:content-box;margin:-3px}
#grass{position:absolute;left:0;top:0;width:600px;height:600px;image-rendering:pixelated}
#gridL{position:absolute;inset:0;background-image:linear-gradient(rgba(0,0,0,.13) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.13) 1px,transparent 1px);background-size:40px 40px}
.layer{position:absolute;inset:0;pointer-events:none}
.cellE{position:absolute;width:40px;height:40px}
.ol{background:rgba(255,255,255,.3);outline:3px dashed rgba(255,255,255,.95);outline-offset:-5px}
.fence svg{display:block;width:40px;height:40px}
.fence.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.18)}100%{transform:scale(1)}}
.mark{z-index:2}
.mark.red{background:rgba(255,40,40,.5);box-shadow:inset 0 0 0 4px #ff2d2d,0 0 18px #ff2d2d;animation:pulse .7s ease-in-out infinite alternate}
.mark.yel{background:rgba(255,220,0,.45);box-shadow:inset 0 0 0 4px #ffd400,0 0 16px #ffd400;animation:pulse .7s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.5}to{opacity:1}}
.spr{position:absolute;width:40px;height:40px;transition:left .35s ease,top .35s ease,transform .3s;z-index:5}
.spr .body{width:100%;height:100%;padding:1px}
.spr svg{display:block;width:100%;height:100%;filter:drop-shadow(0 3px 0 rgba(0,0,0,.3))}
#player.under{transform:translate(-24%,16%) scale(.7)}
#agent{z-index:7}
#agent.over{transform:translate(14%,-8%) scale(.92)}
.animal{z-index:8;transition:left .45s ease,top .45s ease}
.animal.drop .body{animation:drop .5s ease-out}
@keyframes drop{0%{transform:translateY(-50px) scale(.5);opacity:0}60%{transform:translateY(4px) scale(1.1);opacity:1}100%{transform:none}}
#agent .body.tp{animation:tp .5s ease-out}
@keyframes tp{0%{transform:scale(0) rotate(-120deg);opacity:0;filter:brightness(3)}100%{transform:none;opacity:1}}
#bubble{position:absolute;left:50%;bottom:96%;transform:translateX(-50%);background:#c6c6c6;border:2px solid #000;padding:2px;display:none;white-space:nowrap}
#bubble svg{width:24px;height:24px;display:block;filter:none}
#bubble.on{display:block}
#bubble.err{font-family:var(--mc);background:#c62828;color:#fff;font-size:15px;font-weight:700;padding:0 6px}

<script>

const NS='http://www.w3.org/2000/svg';

let AC=null;
function tone(f,dur,type,vol,when){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime+(when||0), o=AC.createOscillator(), g=AC.createGain();
    o.type=type||'square'; o.frequency.value=f;
    g.gain.setValueAtTime(vol||.04,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur+.02);
  }catch(e){}
}
const sClick=()=>{tone(1100,.04,'square',.035); tone(700,.05,'square',.03,.035);};
const sPlace=()=>tone(170,.09,'triangle',.07);
const sShake=()=>{tone(180,.1,'square',.04); tone(140,.12,'square',.04,.1);};

  return s+'</svg>';
}

],{y:'#ffd23f',g:'#8a979e',G:'#cfd8dc',d:'#1b2a38',c:'#3ff0ff',M:'#5f9fb5',o:'#ff8c1a',r:'#ff4d4d',b:'#4dff88',k:'#37424b'});

  "..wwwnnwww..","...wwwwww...",".kkwwwwwwkk.",".kkwwwwwwkk.","..kkk..kkk..","..kkk..kkk.."
],{k:'#1e1e1e',w:'#f4f4f4',e:'#ffffff',n:'#333'});
const HORSE=pix([

],{b:'#8b5a2b',m:'#3b2412',w:'#f2f2f2',k:'#111',l:'#c89b6d',n:'#3b2412',h:'#2b2b2b'});

function noiseCanvas(w,h,cols,seed,extra){
  const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
  const g=cv.getContext('2d');
  const rnd=()=>{seed=(seed*16807)%2147483647; return seed/2147483647;};
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){ g.fillStyle=cols[Math.floor(rnd()*cols.length)]; g.fillRect(x,y,1,1); }
  if(extra) extra(g,rnd);
  return cv;
}
// фон: темна "земля", як у меню
stage.style.backgroundImage=`url(${noiseCanvas(16,16,['#3d2b1c','#35251a','#443120','#2e2016','#4a3626'],777).toDataURL()})`;
// трава у світі
(function(){
  const src=noiseCanvas(N*8,N*8,['#5fae3f','#5fae3f','#5fae3f','#66b546','#579f38','#6cbd4c','#529a35'],12345,(g,rnd)=>{
    for(let i=0;i<40;i++){ g.fillStyle='#4a8f2f'; g.fillRect(Math.floor(rnd()*N*8),Math.floor(rnd()*N*8),1,2); }
    for(let i=0;i<16;i++){ g.fillStyle=rnd()<.5?'#ffe14d':'#ff8ab3'; g.fillRect(Math.floor(rnd()*N*8),Math.floor(rnd()*N*8),1,1); }
  });
  const cv=$('grass'); cv.width=src.width; cv.height=src.height; cv.getContext('2d').drawImage(src,0,0);
})();

/* ================= модель програми ================= */

const B={
  tp:()=>({id:uid++,type:'tp'}),
  slot:(c=1,s=1)=>({id:uid++,type:'slot',count:c,slot:s}),
  mv:(d='fwd',n=1)=>({id:uid++,type:'mv',dir:d,n}),
  pl:(on=true)=>({id:uid++,type:'pl',on})
};
function lessonProgram(){
  return [B.tp(),B.slot(1,1),B.mv('fwd',3),B.mv('right',1),B.pl(true),
          B.mv('left',4),B.mv('back',5),B.mv('right',5),B.mv('fwd',6),B.pl(false)];
}
function newOf(t){ return t==='tp'?B.tp():t==='slot'?B.slot(1,1):t==='mv'?B.mv('fwd',1):B.pl(true); }
const SAMPLE=lessonProgram();
function same(b,s){
  if(!b||!s||b.type!==s.type) return false;
  if(b.type==='slot') return b.count===s.count&&b.slot===s.slot;
  if(b.type==='mv') return b.dir===s.dir&&b.n===s.n;
  if(b.type==='pl') return b.on===s.on;
  return true;
}
const sig=p=>JSON.stringify(p.map(b=>[b.type,b.count,b.slot,b.dir,b.n,b.on]));

function initialProgram(){
  if(level===0) return [];
  if(level===1){
    const p=lessonProgram(); p.forEach(b=>b.lock=true);
    p[5].edit=['n']; p[7].edit=['n'];            // "ліворуч 4" і "праворуч 5"
    return p;
  }
  if(level===2){
    const p=lessonProgram();
    if(breakIdx===0){ p[5].n=3; breakHintId=p[5].id; }          // а) неправильне число → дірка
    else if(breakIdx===1){ breakHintId=p[5].id; p.splice(4,1); } // б) немає "розмістити на ходу УВІМКН."
    else { breakHintId=p[4].id; p.splice(1,1); }                 // в) немає паркану у слоті 1
    return p;
  }
  const t=B.tp(); t.fixed=true; return [t];
}
const fieldEditable=(b,k)=>b.lock?(b.edit||[]).includes(k):true;
const canArrange=b=>!LV[level].locked&&!b.fixed;

/* ================= малювання блоків ================= */
function stmtPath(w,h){
  return `M0 ${R} a${R} ${R} 0 0 1 ${R} ${-R} H${NO} l7 ${ND} h18 l7 ${-ND} H${w-R} a${R} ${R} 0 0 1 ${R} ${R} `+
         `V${h-R} a${R} ${R} 0 0 1 ${-R} ${R} H${NO+NWID} l-7 ${ND} h-18 l-7 ${-ND} H${R} a${R} ${R} 0 0 1 ${-R} ${-R} Z`;
}
function evPath(w,hh,ih){
  const y1=CAP+hh, y2=y1+ih, y3=y2+BH, c=CAP*1.35;
  return `M0 ${CAP} c25 ${-c} 75 ${-c} 100 0 H${w-R} a${R} ${R} 0 0 1 ${R} ${R} V${y1-R} a${R} ${R} 0 0 1 ${-R} ${R} `+
         `H${AW+NO+NWID} l-7 ${ND} h-18 l-7 ${-ND} H${AW+R} a${R} ${R} 0 0 0 ${-R} ${R} V${y2-R} a${R} ${R} 0 0 0 ${R} ${R} `+
         `H${w-R} a${R} ${R} 0 0 1 ${R} ${R} V${y3-R} a${R} ${R} 0 0 1 ${-R} ${R} H${R} a${R} ${R} 0 0 1 ${-R} ${-R} Z`;
}
function mkSvg(){
  const svg=document.createElementNS(NS,'svg'); svg.setAttribute('class','bsvg');
  svg.appendChild(document.createElementNS(NS,'path')); return svg;
}
function blockContent(b,editable){
  const c=document.createElement('div'); c.className='bc';
  const t=s=>{const e=document.createElement('span'); e.className='bt'; e.textContent=s; c.appendChild(e);};
  const field=(cls,html,k,onclick)=>{
    const e=document.createElement('span'); e.className='field '+cls; e.innerHTML=html;
    if(editable&&onclick&&fieldEditable(b,k)) e.addEventListener('click',ev=>{ev.stopPropagation(); onclick(e);});
    else e.classList.add('ro');
    c.appendChild(e); return e;
  };
  switch(b.type){
    case 'tp': t('агент - телепортуватися до гравця'); break;
    case 'slot':
      t('agent, постав блок або предмет');
      field('fitem',FENCE_ICON+'<span>паркан</span>','item');
      t('кількість'); field('fnum',b.count,'count',e=>openNum(b,'count',e));
      t('у слот');    field('fnum',b.slot,'slot',e=>openNum(b,'slot',e));
      break;
    case 'mv':
      t('агент - переміститися');
      field('fdrop',esc(DIRS[b.dir].l)+' <span class="caret">▾</span>','dir',e=>openDrop(b,e));
      t('by'); field('fnum',b.n,'n',e=>openNum(b,'n',e));
      break;
    case 'pl':
      t('агент - розмістити на ходу');
      field('ftoggle '+(b.on?'on':'off'),
        b.on?'<span class="tl">УВІМКН.</span><span class="tk"></span>':'<span class="tk"></span><span class="tl">ВИМКН.</span>',
        'on',()=>{ b.on=!b.on; sClick(); programChanged(); validateBlock(b); });
      break;
  }
  return c;
}
function makeStmt(b,editable){
  const el=document.createElement('div');
  el.className='blk'; el.dataset.id=b.id; el.dataset.type=b.type;
  el.appendChild(mkSvg());
  el.appendChild(blockContent(b,editable));
  if(editable){
    if(canArrange(b)) el.appendChild(makeTools(b));
    else el.classList.add(b.fixed?'fixed':'locked');
  }
  return el;
}
function shapeStmt(el,col){
  const c=el.querySelector('.bc'); const w=c.offsetWidth, h=c.offsetHeight;
  const svg=el.querySelector('.bsvg'); svg.setAttribute('width',w); svg.setAttribute('height',h+ND);
  const p=svg.firstChild; p.setAttribute('d',stmtPath(w,h)); p.setAttribute('fill',col.f); p.setAttribute('stroke',col.s);
  el.style.width=w+'px'; el.style.height=h+'px';
  return {w,h};
}
function makeEvent(){
  const el=document.createElement('div'); el.className='blk ev fixed';
  el.appendChild(mkSvg());
  const c=document.createElement('div'); c.className='bc evh'; c.style.top=CAP+'px';
  const t=document.createElement('span'); t.className='bt'; t.textContent='при команді чату'; c.appendChild(t);
  const f=document.createElement('span'); f.className='field fstr ro'; f.textContent='1'; c.appendChild(f);
  el.appendChild(c);
  return el;
}
function shapeEvent(el,w,hh,ih){
  const svg=el.querySelector('.bsvg'); const H=CAP+hh+ih+BH;
  svg.setAttribute('width',w); svg.setAttribute('height',H);
  const p=svg.firstChild; p.setAttribute('d',evPath(w,hh,ih)); p.setAttribute('fill',COL.ev.f); p.setAttribute('stroke',COL.ev.s);
  el.style.width=w+'px'; el.style.height=H+'px';
  return H;
}
function makeTools(b){
  const t=document.createElement('div'); t.className='btools';
  [['↑','up','Вище',()=>moveBlock(b.id,-1)],['↓','dn','Нижче',()=>moveBlock(b.id,1)],['✕','del','Видалити',()=>delBlock(b.id)]]
  .forEach(([s,c,title,f])=>{
    const bt=document.createElement('button'); bt.textContent=s; bt.className=c; bt.title=title;
    bt.addEventListener('pointerdown',e=>e.stopPropagation());
    bt.addEventListener('click',e=>{e.stopPropagation(); f();});
    t.appendChild(bt);
  });
  return t;
}
// розкладка стека блоків: подія + вкладені блоки; повертає елементи
function layoutStack(container,prog,editable,x0,y0){
  const ev=makeEvent(); ev.style.left=x0+'px'; ev.style.top=y0+'px'; container.appendChild(ev);
  const els=prog.map(b=>{const e=makeStmt(b,editable); container.appendChild(e); return e;});
  const hc=ev.querySelector('.bc'); const hh=hc.offsetHeight, hw=Math.max(hc.offsetWidth,230);
  let y=y0+CAP+hh; const startY=y, x=x0+AW; let maxW=hw;
  els.forEach(e=>{ const {w,h}=shapeStmt(e,COL.agent); e.style.left=x+'px'; e.style.top=y+'px'; y+=h; maxW=Math.max(maxW,AW+w); });
  const ih=Math.max(y-startY,30);
  const H=shapeEvent(ev,hw,hh,ih);
  return {els,startY,H,W:maxW};
}

const wsInner=$('wsInner'), wsScroll=$('wsScroll');
let progEls=[], innerStartY=0, marker=null;
function renderProgram(){

function elOf(id){ return progEls.find(e=>+e.dataset.id===id); }
function scrollToEl(e){
  if(!e) return;
  const top=parseFloat(e.style.top), h=e.offsetHeight, st=wsScroll.scrollTop, ch=wsScroll.clientHeight;
  if(top<st+10||top+h>st+ch-30) wsScroll.scrollTop=Math.max(0,top-ch/3);
}
function setRunHL(id){
  runId=id;
  progEls.forEach(e=>{ const on=+e.dataset.id===id; e.classList.toggle('run',on); if(on) scrollToEl(e); });
}
function shakeBlock(id){
  const e=elOf(id); if(!e) return;
  e.classList.remove('shake'); void e.offsetWidth; e.classList.add('shake');
  scrollToEl(e);
}
function programChanged(){
  if(run){ stopRun(); showMsg('Програму змінено. Запусти ще раз.','info'); }
  answerMode=false; hintIds.clear();
  // знімаємо червону позначку з блоків, які вже збігаються зі зразком
  [...flagged].forEach(id=>{ const i=program.findIndex(b=>b.id===id); if(i<0||same(program[i],SAMPLE[i])) flagged.delete(id); });
  renderProgram();
}
function moveBlock(id,d){
  const i=program.findIndex(b=>b.id===id), j=i+d;
  if(i<0||j<0||j>=program.length||!canArrange(program[j])) return;
  [program[i],program[j]]=[program[j],program[i]]; sClick(); programChanged();
}
function delBlock(id){
  const i=program.findIndex(b=>b.id===id); if(i<0||!canArrange(program[i])) return;
  program.splice(i,1); closePopup(); sClick(); programChanged();
}
function insertBlock(t,idx){
  const b=newOf(t);
  if(idx==null||idx>program.length) idx=program.length;
  program.splice(idx,0,b); sClick(); programChanged();
  const e=elOf(b.id); if(e){ e.classList.add('flash'); setTimeout(()=>e.classList.remove('flash'),500); scrollToEl(e); }
  if(LV[level].marks) validateAdd(b,idx);
}

/* ---------- перевірка зі зразком (рівень 1) ---------- */
function matchedPrefix(){ let i=0; while(i<program.length&&i<SAMPLE.length&&same(program[i],SAMPLE[i])) i++; return i; }
function flagBlock(b){
  flagged.add(b.id); renderProgram(); shakeBlock(b.id); sShake();
  showMsg('Подивись у зразок ще раз 👀','warn');
}
function validateAdd(b,idx){
  const s=SAMPLE[idx];
  if(!s||s.type!==b.type){ flagBlock(b); return; }
  for(let j=0;j<idx;j++) if(!same(program[j],SAMPLE[j])){ flagBlock(program[j]); return; }
}
function validateBlock(b){
  if(!LV[level].marks) return;
  const i=program.indexOf(b); if(i<0) return;
  if(!same(b,SAMPLE[i])) flagBlock(b);
  else if(flagged.delete(b.id)) renderProgram();
}

const sampleInner=$('sampleInner');
let sampleEls=[];

let cand=null, drag=null;
wsInner.addEventListener('pointerdown',e=>{
  if(e.button!==0) return;
  const blk=e.target.closest('.blk'); if(!blk||blk.classList.contains('ev')) return;
  if(e.target.closest('.field,.btools')) return;
  const b=program.find(p=>p.id===+blk.dataset.id); if(!b||!canArrange(b)) return;
  cand={kind:'prog',id:b.id,el:blk,x:e.clientX,y:e.clientY}; e.preventDefault();
});
$('palInner').addEventListener('pointerdown',e=>{
  if(e.button!==0) return;
  const blk=e.target.closest('.blk'); if(!blk) return;
  cand={kind:'pal',type:blk.dataset.type,el:blk,x:e.clientX,y:e.clientY}; e.preventDefault();
});
addEventListener('pointermove',e=>{
  if(cand&&!drag&&Math.hypot(e.clientX-cand.x,e.clientY-cand.y)>6) beginDrag(e);
  if(drag) moveDrag(e);
});
addEventListener('pointerup',e=>{
  if(drag) endDrag(e);
  else if(cand&&cand.kind==='pal') insertBlock(cand.type,null);
  cand=null;
});
function inRect(e,el){const r=el.getBoundingClientRect(); return r.width>0&&e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom;}
function beginDrag(e){
  closePopup();
  const r=cand.el.getBoundingClientRect();
  const ghost=cand.el.cloneNode(true); ghost.classList.add('ghost'); ghost.classList.remove('run','hint','flash','wrong','shake');
  stage.appendChild(ghost);
  drag=Object.assign({},cand,{ghost,offX:(e.clientX-r.left)/S,offY:(e.clientY-r.top)/S,idx:null,del:false});
  if(drag.kind==='prog') cand.el.classList.add('dsrc');
  moveDrag(e);
}
function moveDrag(e){
  const st=stage.getBoundingClientRect();
  drag.ghost.style.left=((e.clientX-st.left)/S-drag.offX)+'px';
  drag.ghost.style.top=((e.clientY-st.top)/S-drag.offY)+'px';
  const overWs=inRect(e,$('ws')), overPal=inRect(e,$('palStrip'));
  drag.del=drag.kind==='prog'&&overPal;
  $('palStrip').classList.toggle('trash',drag.del);
  if(overWs){
    const list=progEls.filter(el=>!(drag.kind==='prog'&&+el.dataset.id===drag.id));
    const refY=e.clientY-drag.offY*S+22*S;
    let idx=0; list.forEach(el=>{const r=el.getBoundingClientRect(); if(r.top+r.height/2<refY) idx++;});
    drag.idx=idx;
    const ir=wsInner.getBoundingClientRect();
    let my;
    if(idx<list.length) my=(list[idx].getBoundingClientRect().top-ir.top)/S;
    else if(list.length) my=(list[list.length-1].getBoundingClientRect().bottom-ir.top)/S;
    else my=innerStartY;
    marker.style.display='block'; marker.style.left=(EX+AW)+'px'; marker.style.top=(my-4)+'px';
  }else{ drag.idx=null; if(marker) marker.style.display='none'; }
}
function endDrag(){
  const d=drag; drag=null;
  d.ghost.remove(); $('palStrip').classList.remove('trash'); if(marker) marker.style.display='none';
  if(d.kind==='prog'){
    const i=program.findIndex(b=>b.id===d.id);
    if(d.del&&i>=0){ program.splice(i,1); sClick(); programChanged(); return; }
    if(d.idx!==null&&i>=0){ const [b]=program.splice(i,1); program.splice(d.idx,0,b); sClick(); programChanged(); return; }
    d.el.classList.remove('dsrc');
  }else if(d.idx!==null){
    insertBlock(d.type,d.idx);
  }
}

/* ================= виконання програми ================= */
let run=null;
function compile(){
  const st=[];
  program.forEach(b=>{ if(b.type==='mv'){ for(let k=0;k<b.n;k++) st.push({b,k}); } else st.push({b}); });
  return st;
}
function startRun(){
  closePopup(); stopRun(); resetWorld(); hideMsg();
  if(!program.length){ showMsg('Додай блоки в програму.','warn'); return false; }
  if(LV[level].marks){
    const i=matchedPrefix();
    if(i<program.length||program.length<SAMPLE.length){
      const b=program[Math.min(i,program.length-1)];
      if(b&&!same(b,SAMPLE[program.indexOf(b)])) flagged.add(b.id);
      renderProgram(); if(b) shakeBlock(b.id);
      showMsg('Подивись у зразок ще раз 👀 Але запустимо — подивись, що вийде.','warn');
    }
  }
  run={steps:compile(),pc:0,timer:null};
  updateButtons();
  run.timer=setTimeout(advance,600);
  return true;
}
function stopRun(){
  if(!run) return;
  clearTimeout(run.timer); run=null; setRunHL(null); updateButtons();
}
function advance(){
  if(!run) return;
  const s=run.steps[run.pc++];
  setRunHL(s.b.id);
  exec(s);
  if(!run) return;
  run.timer=setTimeout(run.pc>=run.steps.length?finishRun:advance,STEP_MS);
}
function exec(s){
  const b=s.b;
  if(b.type==='tp'){
    W.agent={...PLAYER}; W.teleported=true;
    if(W.placeOn) placeFence();
  }else if(b.type==='slot'){
    if(b.slot===1){ W.hasFence=true; W.slotCount=b.count; }
    else showMsg(`Паркан у слоті ${b.slot}. А агент будує зі слоту 1!`,'warn');
  }else if(b.type==='mv'){
    const d=DIRS[b.dir], nx=W.agent.x+d.dx, ny=W.agent.y+d.dy;
    if(!inB(nx,ny)) showMsg('Агент дійшов до краю світу!','warn');
    else { W.agent={x:nx,y:ny}; if(W.placeOn) placeFence(); }
  }else if(b.type==='pl'){
    W.placeOn=b.on;
    if(b.on) placeFence();
  }
  renderWorld();
}
function placeFence(){
  if(!W.hasFence){
    if(!W.warned){ W.warned=true; showMsg('В інвентарі агента немає паркану!','err'); }
    return;
  }
  const k=key(W.agent.x,W.agent.y);
  if(!W.fences.has(k)){ W.fences.add(k); W.newFence=k; }
}
function finishRun(){
  if(!run) return;
  clearTimeout(run.timer); run=null; setRunHL(null);
  built=true; updateButtons();
  const wasAns=answerMode; answerMode=false;
  const btn=LV[level].btn;
  if(level===2&&analyze(W.fences).kind!=='closed'){
    if(W.warned) showMsg('В інвентарі агента порожньо 🤔','warn');
    else if(!W.fences.size) showMsg('Агент іде, але не ставить паркан 🤔','warn');
    else showMsg(`Одна сторона коротша 🤔 Натисни "${btn}" і перевір.`,'warn');
  }
  else if(W.warned) showMsg('В інвентарі агента немає паркану! 🤔','err');
  else if(!W.fences.size) showMsg('Агент пройшов, але не поставив паркан 🤔','warn');
  else showMsg(`Агент закінчив! Тепер натисни "${btn}".`,'info');

/* ================= перевірка загону ================= */
const D4=[[0,-1],[1,0],[0,1],[-1,0]];
function enclosed(fs){
  const out=new Uint8Array(N*N), q=[];
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){
    if((x===0||y===0||x===N-1||y===N-1)&&!fs.has(key(x,y))){ out[y*N+x]=1; q.push([x,y]); }
  }
  while(q.length){
    const [x,y]=q.pop();
    for(const [dx,dy] of D4){ const nx=x+dx, ny=y+dy; if(!inB(nx,ny)) continue; const i=ny*N+nx;
      if(out[i]||fs.has(key(nx,ny))) continue; out[i]=1; q.push([nx,ny]); }
  }
  const seen=new Uint8Array(N*N), regs=[];
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){
    const i=y*N+x; if(out[i]||seen[i]||fs.has(key(x,y))) continue;
    const reg=[], st=[[x,y]]; seen[i]=1;
    while(st.length){
      const [cx,cy]=st.pop(); reg.push({x:cx,y:cy});
      for(const [dx,dy] of D4){ const nx=cx+dx, ny=cy+dy; if(!inB(nx,ny)) continue; const j=ny*N+nx;
        if(seen[j]||out[j]||fs.has(key(nx,ny))) continue; seen[j]=1; st.push([nx,ny]); }
    }
    regs.push(reg);
  }
  return regs;
}
function near8(x,y,set){
  for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){ if((dx||dy)&&set.has(key(x+dx,y+dy))) return true; }
  return false;
}
const largest=regs=>regs.reduce((a,b)=>b.length>a.length?b:a);
function bbox(cells){
  let x0=99,y0=99,x1=-1,y1=-1;
  cells.forEach(c=>{x0=Math.min(x0,c.x);y0=Math.min(y0,c.y);x1=Math.max(x1,c.x);y1=Math.max(y1,c.y);});
  return {x0,y0,x1,y1,w:x1-x0+1,h:y1-y0+1};
}
function pickStart(cells){
  const cx=cells.reduce((s,c)=>s+c.x,0)/cells.length, cy=cells.reduce((s,c)=>s+c.y,0)/cells.length;
  const busy=c=>(c.x===PLAYER.x&&c.y===PLAYER.y)||(c.x===W.agent.x&&c.y===W.agent.y);
  const sorted=cells.slice().sort((a,b)=>Math.hypot(a.x-cx,a.y-cy)-Math.hypot(b.x-cx,b.y-cy));
  return sorted.find(c=>!busy(c))||sorted[0];
}
function pathOut(fs,s){
  const prev=new Map([[key(s.x,s.y),null]]), q=[s]; let end=null;
  while(q.length){
    const c=q.shift();
    if(c.x===0||c.y===0||c.x===N-1||c.y===N-1){ end=c; break; }
    for(const [dx,dy] of D4){ const nx=c.x+dx, ny=c.y+dy, k=key(nx,ny);
      if(!inB(nx,ny)||fs.has(k)||prev.has(k)) continue; prev.set(k,c); q.push({x:nx,y:ny}); }
  }
  if(!end) return [s];
  const p=[]; let c=end; while(c){ p.push(c); c=prev.get(key(c.x,c.y)); }
  return p.reverse();
}
function analyze(fs){
  if(!fs.size) return {kind:'empty'};
  const regs=enclosed(fs);
  if(regs.length){
    const interior=new Set(); regs.forEach(r=>r.forEach(c=>interior.add(key(c.x,c.y))));
    const pen=largest(regs);
    const extras=[...fs].map(unkey).filter(c=>!near8(c.x,c.y,interior));
    return {kind:'closed',pen,start:pickStart(pen),extras,bb:bbox(pen)};
  }
  // Пошук дірки: яка ОДНА клітинка замкнула б загін?
  let best=null;
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){
    const k=key(x,y); if(fs.has(k)||!near8(x,y,fs)) continue;
    const f2=new Set(fs); f2.add(k);
    const r=enclosed(f2); if(!r.length) continue;
    const size=largest(r).length;
    const gap=(fs.has(key(x-1,y))&&fs.has(key(x+1,y)))||(fs.has(key(x,y-1))&&fs.has(key(x,y+1)));
    const score=(gap?1000:0)+size;
    if(!best||score>best.score) best={score,x,y,regs:r};
  }
  if(best){
    const pen=largest(best.regs), hole={x:best.x,y:best.y}, start=pickStart(pen);
    let path=pathOut(fs,start);
    const hi=path.findIndex(c=>c.x===hole.x&&c.y===hole.y);
    if(hi>=0) path=path.slice(0,Math.min(path.length,hi+4));
    return {kind:'hole',start,path,hole,pen};
  }
  // Кілька дірок або паркан не схожий на загін
  const bb=bbox([...fs].map(unkey));
  if(bb.w<3||bb.h<3) return {kind:'small'};
  const cx=(bb.x0+bb.x1)/2, cy=(bb.y0+bb.y1)/2; let start=null, bd=1e9;
  for(let y=bb.y0+1;y<bb.y1;y++) for(let x=bb.x0+1;x<bb.x1;x++){
    if(fs.has(key(x,y))) continue; const d=Math.hypot(x-cx,y-cy); if(d<bd){bd=d; start={x,y};}
  }
  if(!start) return {kind:'small'};
  let path=pathOut(fs,start), ei=0;
  path.forEach((c,i)=>{ if(c.x>=bb.x0&&c.x<=bb.x1&&c.y>=bb.y0&&c.y<=bb.y1) ei=i; });
  const hole=path[ei]; path=path.slice(0,Math.min(path.length,ei+4));
  return {kind:'hole',start,path,hole};
}
function exactOutline(a){
  const o=LV[level].outline; if(!o||a.kind!=='closed') return false;
  for(let y=o.y0;y<=o.y1;y++) for(let x=o.x0;x<=o.x1;x++)
    if((x===o.x0||x===o.x1||y===o.y0||y===o.y1)&&!W.fences.has(key(x,y))) return false;
  const w=o.x1-o.x0-1, h=o.y1-o.y0-1;
  return a.bb.x0===o.x0+1&&a.bb.y0===o.y0+1&&a.bb.w===w&&a.bb.h===h&&a.pen.length===w*h;
}

/* ---------- тварини ---------- */
function clearAnimals(){
  animalTimers.forEach(t=>{clearTimeout(t); clearInterval(t);}); animalTimers=[];
  animals=[]; $('animalsL').innerHTML=''; $('fxL').innerHTML='';
  marks=[]; renderMarks();
}
function spawnAnimal(c){
  const d=document.createElement('div'); d.className='spr animal drop';
  d.innerHTML='<div class="body">'+ANIMALS[LV[level].animal].svg+'</div>';
  d.style.left=c.x*CELL+'px'; d.style.top=c.y*CELL+'px';
  $('animalsL').appendChild(d);
  const a={el:d,x:c.x,y:c.y}; animals.push(a); return a;
}
function moveAnimal(a,c){ a.x=c.x; a.y=c.y; a.el.style.left=c.x*CELL+'px'; a.el.style.top=c.y*CELL+'px'; }
function startCells(pen,first,n){
  const busy=c=>(c.x===PLAYER.x&&c.y===PLAYER.y)||(c.x===W.agent.x&&c.y===W.agent.y);
  const res=[first];
  const rest=pen.filter(c=>!(c.x===first.x&&c.y===first.y)&&!busy(c))
    .sort((a,b)=>Math.hypot(a.x-first.x,a.y-first.y)-Math.hypot(b.x-first.x,b.y-first.y));
  for(let i=0;i<rest.length&&res.length<n;i++) res.push(rest[i]);
  return res;
}
function hearts(a,delay){
  animalTimers.push(setTimeout(()=>{
    const h=document.createElement('div'); h.className='heart'; h.textContent='♥';
    h.style.left=(a.x*CELL+Math.random()*24-4)+'px'; h.style.top=(a.y*CELL-8)+'px';
    $('fxL').appendChild(h); setTimeout(()=>h.remove(),1800);
  },delay));
}
function wander(pen){
  const inPen=new Set(pen.map(c=>key(c.x,c.y)));
  const iv=setInterval(()=>{
    animals.forEach(a=>{
      if(Math.random()<.4) return;
      const opts=D4.map(([dx,dy])=>({x:a.x+dx,y:a.y+dy}))
        .filter(c=>inPen.has(key(c.x,c.y))&&!animals.some(o=>o!==a&&o.x===c.x&&o.y===c.y)&&!(c.x===PLAYER.x&&c.y===PLAYER.y));
      if(opts.length) moveAnimal(a,opts[Math.floor(Math.random()*opts.length)]);
    });
  },1200);
  animalTimers.push(iv);
  animalTimers.push(setTimeout(()=>clearInterval(iv),30000));
}
function releaseAnimals(){
  if(run||!built) return;
  closePopup(); clearAnimals();
  const A=ANIMALS[LV[level].animal];
  const a=analyze(W.fences);
  if(a.kind==='empty'){ sFail(); showMsg(A.gone+' 🤔','warn'); return; }
  if(a.kind==='small'){ sFail(); showMsg('Загін замалий — тваринам нема місця.','warn'); return; }

  if(a.kind==='closed'){
    const cells=startCells(a.pen,a.start,LV[level].count);
    cells.forEach(c=>spawnAnimal(c));
    let win=true, type='ok', html=A.ok;
    if(level===1&&!exactOutline(a)){ win=false; type='warn'; html='Загін закритий, але не по пунктиру. Перевір числа 🤔'; }
    if(level===3){
      if(!exactOutline(a)){ win=false; type='warn'; html='Загін закритий, але не по пунктиру 🤔'; }
      else if(a.extras.length){
        win=false; type='warn'; html='Майже! Жовтий паркан — зайвий 🤔';
        marks=a.extras.map(c=>({x:c.x,y:c.y,c:'yel'})); renderMarks();
      }
    }
    animals.forEach((an,i)=>{ for(let k=0;k<4;k++) hearts(an,700+k*700+i*300); });
    wander(a.pen);
    showMsg(html,type);
    if(win){
      animalTimers.push(setTimeout(()=>{ sWin(); animals.forEach(an=>puff(an.x,an.y)); },600));
      if(!LV[level].guided) animalTimers.push(setTimeout(levelWon,2600));
    }else sFail();
    return;
  }
  // дірка: тварини йдуть до виходу
  const starts=a.pen?startCells(a.pen,a.start,LV[level].count):[a.start];
  const walkers=starts.map(c=>{
    const an=spawnAnimal(c); let p=pathOut(W.fences,c);
    const hi=p.findIndex(q=>q.x===a.hole.x&&q.y===a.hole.y);
    if(hi>=0) p=p.slice(0,Math.min(p.length,hi+4));
    return {an,p,i:1,wait:0};
  });
  showMsg('Тварини оглядаються… 👀','info');
  const step=()=>{
    let moving=false;
    walkers.forEach(w=>{
      if(w.i<w.p.length){
        const c=w.p[w.i++]; moving=true;
        if(!animals.some(o=>o!==w.an&&o.x===c.x&&o.y===c.y)){ moveAnimal(w.an,c); w.wait=0; }
        else if(++w.wait<3) w.i--;            // клітинка зайнята — трохи зачекати
        else w.i=w.p.length;                  // друга тварина стоїть попереду — зупинитись
        if(c.x===a.hole.x&&c.y===a.hole.y&&!marks.length){ marks=[{x:c.x,y:c.y,c:'red'}]; renderMarks(); }
      }
    });
    if(moving) animalTimers.push(setTimeout(step,480));
    else{
      marks=[{x:a.hole.x,y:a.hole.y,c:'red'}]; renderMarks(); sFail();
      showMsg(A.out+' 🔴','err');
    }
  };
  animalTimers.push(setTimeout(step,1000));
}

$('hintBtn').onclick=()=>{
  closePopup(); hintIds.clear();
  let text='';
  if(level===0){
    const i=matchedPrefix();

    else if(i<program.length) text='💡 Блок з червоною рамкою не збігається зі зразком.';
    else text='💡 Знайди блок зі стрілкою 👉 і додай його.';
    const e=sampleEls[i]; if(e){ e.classList.remove('pulse'); void e.offsetWidth; e.classList.add('pulse'); }
  }else if(level===1){
    text='💡 Пунктир ширший на 2 клітинки. Додай по 2 у блоках, що світяться.';
  }else if(level===2){
    if(program.some(b=>b.id===breakHintId)) hintIds.add(breakHintId);
    text=['💡 Порівняй числа в цьому блоці зі зразком.',
          '💡 Перед цим блоком чогось не вистачає.',
          '💡 Агент хоче будувати. Що має бути в слоті 1?'][breakIdx];
  }else{
    text=hintStep===0?'💡 Спершу паркан у слот 1 і розміщення на ходу УВІМКН.':'💡 Кожна сторона — 4 кроки.';
    hintStep=Math.min(1,hintStep+1);
  }
  renderProgram(); showMsg(text,'info');
};

$('answerBtn').onclick=()=>{
  closePopup(); hintIds.clear(); flashIds.clear(); flagged.clear();
  if(level===0){ program=lessonProgram(); }
  else if(level===1){
    const p=initialProgram(); p[5].n=6; p[7].n=7; flashIds.add(p[5].id); flashIds.add(p[7].id); program=p;
  }else if(level===2){
    const p=lessonProgram(); flashIds.add([p[5].id,p[4].id,p[1].id][breakIdx]); program=p;
  }else{
    const t=B.tp(); t.fixed=true;
    const p=[t,B.slot(1,1),B.mv('fwd',1),B.pl(true),B.mv('fwd',4),B.mv('right',4),B.mv('back',4),B.mv('left',4),B.pl(false)];
    p.slice(1).forEach(b=>flashIds.add(b.id)); program=p;
  }
  renderProgram();
  if(startRun()) answerMode=true;
};

/* ================= рівень 1: як агент будує загін (покроково) ================= */
const STAGES=['Покликати агента','Дати паркан','Показати шлях','Випустити тваринку'];
const PEN={x0:4,y0:5,x1:9,y1:10};
const LETTERS=['А','Б','В'];
const lk=arr=>{ arr.forEach(b=>b.lock=true); return arr; };
const G=[
  {stage:0, kind:'cmd', chat:true,
   q:'Агент далеко! Яка команда покличе його до нас?',
   cards:[{b:()=>B.mv('fwd',1), why:'Агент зробить лише 1 крок. А він далеко!'},
          {b:()=>B.tp(), ok:true},
          {b:()=>B.pl(true), why:'Це вмикає будування. А агент ще далеко!'}],
   a:'Телепортуватися до гравця! Пишемо в чат 1 — і агент уже біля нас.'},
  {stage:1, kind:'cmd', pulse:'slot',
   q:'З чого агент буде будувати? Яка команда дасть йому паркан?',
   cards:[{b:()=>B.tp(), why:'Агент уже біля нас. А паркану в нього все ще немає.'},
          {b:()=>B.mv('fwd',3), why:'Агент піде, але в інвентарі порожньо.'},
          {b:()=>B.slot(1,1), ok:true}],
   a:'Кладемо паркан у слот 1. Тепер агенту є з чого будувати!'},
  {stage:2, kind:'map', add:()=>[B.mv('fwd',3),B.mv('right',1)],
   q:'Агент піде вперед на 3, потім праворуч на 1. Де він опиниться?',
   sub:'Білий пунктир — тут буде загін. Натисніть на літеру.',
   choices:[{x:6,y:5},{x:7,y:5},{x:8,y:5,ok:true}],
   a:'В! Агент у кутку майбутнього загону.'},
  {stage:2, kind:'cmd', pulse:'pill',
   q:'Що скажемо агенту, щоб він почав ставити паркан?',
   cards:[{b:()=>B.mv('left',4), why:'Агент піде, але нічого не поставить.'},
          {b:()=>B.pl(true), ok:true},
          {b:()=>B.pl(false), why:'ВИМКН. — це щоб зупинити будування.'}],
   a:'Розміщення на ходу УВІМКН.! Паркан з’явився прямо під агентом.'},
  {stage:2, kind:'opt', add:()=>[B.mv('left',4)],
   q:'Агент піде ліворуч на 4. Скільки нових блоків паркану з’явиться?',
   opts:['3 блоки','4 блоки','5 блоків'], ok:1,
   a:'4 нові блоки! Один крок — один блок паркану.'},
  {stage:2, kind:'map', add:()=>[B.mv('back',5)],
   q:'Агент піде назад на 5. Де він опиниться?',
   sub:'Назад — це вниз. Натисніть на літеру.',
   choices:[{x:4,y:0},{x:4,y:10,ok:true},{x:4,y:11}],
   a:'Б! Рівно 5 клітинок униз.'},
  {stage:2, kind:'opt', add:()=>[B.mv('right',5)],
   q:'Агент піде праворуч на 5. Яку сторону загону він збудує?',
   opts:['Верхню','Нижню','Ліву'], ok:1,
   a:'Нижню! Залишилась остання сторона.'},
  {stage:2, kind:'opt', add:()=>[B.mv('fwd',6)],
   q:'Агент піде вперед на 6. Загін замкнеться?',
   opts:['👍 Так','👎 Ні'], ok:0,
   a:'Так, загін замкнувся! А один блок вийшов зайвий — бачите де?'},
  {stage:2, kind:'cmd', pulse:'pill',
   q:'Загін готовий. Яка команда зупинить будування?',
   cards:[{b:()=>B.pl(true), why:'Розміщення вже увімкнене!'},
          {b:()=>B.tp(), why:'Агент стрибне до гравця і поставить паркан і там!'},
          {b:()=>B.pl(false), ok:true}],
   a:'Розміщення на ходу ВИМКН. Агент більше нічого не ставить.'},
  {stage:3, kind:'opt', panda:true,
   q:'Як думаєте, панда залишиться в загоні?',
   opts:['👍 Так','👎 Ні'], ok:0,
   a:'Залишилась! Загін закритий — панда в безпеці 💚'},
  {stage:4, kind:'opt', trap:'slot',
   q:'А що буде, якщо забути дати агенту паркан?',
   opts:['Агент збудує загін','Агент піде, а паркану не буде','Агент не зрушить з місця'], ok:1,
   a:'Паркану немає — панда тікає! Етап 2 дуже важливий.'},
  {stage:4, kind:'opt', trap:'pl',
   q:'А якщо не увімкнути розміщення на ходу?',
   opts:['Буде тільки один блок','Агент просто погуляє','Агент збудує загін'], ok:1,
   a:'Агент просто гуляє — паркан не з’являється. Етап 3 теж потрібен!'}
];
let gi=0, gState='ask', gBusy=false, gTimers=[], gPicked=null, gWrong=new Set(), gBl=null;
const pendIds=new Set();
function gStop(){ gTimers.forEach(clearTimeout); gTimers=[]; gBusy=false; setRunHL(null); pendIds.clear(); }
const gLater=(f,ms)=>gTimers.push(setTimeout(f,ms));
const compileOf=blocks=>{ const st=[]; blocks.forEach(b=>{ if(b.type==='mv') for(let k=0;k<b.n;k++) st.push({b,k}); else st.push({b}); }); return st; };
const badge=l=>`<span class="lt l${'ABC'[LETTERS.indexOf(l)]}">${l}</span>`;
const okIndex=st=>st.kind==='cmd'?st.cards.findIndex(c=>c.ok):st.kind==='map'?st.choices.findIndex(c=>c.ok):st.ok;
function clearStepNums(){ document.querySelectorAll('#fxL .stepnum').forEach(e=>e.remove()); }
function playBlocks(blocks,ms,done){
  const st=compileOf(blocks); let i=0, cur=null;
  const tick=()=>{
    if(i>=st.length){ setRunHL(null); done(); return; }
    const s=st[i++];
    if(s.b!==cur){ cur=s.b; clearStepNums(); }
    setRunHL(s.b.id); exec(s);
    if(s.b.type==='mv'){
      const d=document.createElement('div'); d.className='stepnum';
      d.style.left=W.agent.x*CELL+'px'; d.style.top=W.agent.y*CELL+'px'; d.innerHTML=`<span>${s.k+1}</span>`;
      $('fxL').appendChild(d);
    }
    gLater(tick,ms);
  };
  gLater(tick,400);
}
// рядок чату в стилі гри замість поля вводу
function chatSay(cb){
  const c=$('chatLine'); c.textContent='<Гравець> 1'; c.classList.remove('off'); sClick();
  gLater(()=>c.classList.add('off'),3500);
  gLater(cb,900);
}
function gRebuild(idx){
  clearAnimals(); hideMsg();
  W.silent=true; resetWorld(); program=[];
  for(let j=0;j<idx;j++){
    const st=G[j]; let bl=null;
    if(st.kind==='cmd') bl=lk([st.cards.find(c=>c.ok).b()]);
    else if(st.add) bl=lk(st.add());
    if(bl){ program.push(...bl); compileOf(bl).forEach(exec); }
  }
  W.silent=false; W.teleported=false; renderWorld();
  flashIds.clear();
}
function gGo(idx){
  gStop(); gi=idx; gState='ask'; gPicked=null; gWrong.clear(); gBl=null;
  $('chatLine').classList.add('off');
  gRebuild(idx);
  const st=G[gi];
  if(st.add){ gBl=lk(st.add()); program.push(...gBl); gBl.forEach(b=>pendIds.add(b.id)); }
  renderProgram(); renderOutline(); renderGuided();
}
function renderGuided(){
  const st=G[gi];
  const lastOfStage=!G[gi+1]||G[gi+1].stage!==st.stage;
  const isDone=i=>i<st.stage||(i===st.stage&&gState==='done'&&lastOfStage);
  $('gTrack').innerHTML=STAGES.map((n,i)=>
    `<div class="gst${isDone(i)?' done':''}${i===st.stage?' cur':''}"><b>${isDone(i)?'✔':i+1}</b>${n}</div>`
  ).join('<span class="garr">→</span>');
  $('tBadge').textContent=st.trap?'🧠 Перевірка':`Крок ${gi+1} з ${G.length}`;
  $('gQ').textContent=st.q;
  $('gSub').textContent=st.sub||'';
  let ans='';
  if(gState==='done'){
    const v=gPicked==null||st.kind==='cmd'?'':gPicked===okIndex(st)?'🎉 Правильно! ':'🙂 Не зовсім. ';
    ans='✅ '+v+esc(st.a).replace(/^([АБВ])!/,(m,l)=>badge(l)+'!');
  }
  $('gA').innerHTML=ans;
  const m=$('gMain');
  m.textContent=gBusy?'⏳ Дивимось…':gState==='ask'?'Показати відповідь':gi<G.length-1?'Далі ▶':'📋 Схема';
  m.disabled=gBusy;
  $('gBack').disabled=gBusy||(gi===0&&gState==='ask');
  $('gRestart').disabled=gBusy;
  // літери на карті
  const L=$('choiceL'); L.innerHTML='';
  if(st.kind==='map') st.choices.forEach((c,i)=>{
    const d=document.createElement('div');
    d.className='cellE choice c'+'ABC'[i]+(gState==='done'?(c.ok?' ok':' no'):'');
    d.style.left=c.x*CELL+'px'; d.style.top=c.y*CELL+'px'; d.textContent=LETTERS[i];
    d.onclick=()=>gPick(i); L.appendChild(d);
  });
  renderCards();
  $('slotBox').classList.toggle('pulse',st.pulse==='slot'&&gState==='ask');
  $('placePill').classList.toggle('pulse',st.pulse==='pill'&&gState==='ask');
}
function renderCards(){
  const st=G[gi], box=$('gCards'); box.innerHTML=''; box.classList.remove('hidden');
  const hd=document.createElement('div'); hd.className='ghd';
  hd.textContent=st.kind==='cmd'?'🤔 Яку команду дамо агенту?':st.kind==='map'?'🤔 Куди прийде агент?':'🤔 Як думаєте?';
  box.appendChild(hd);
  const n=st.kind==='cmd'?st.cards.length:st.kind==='map'?st.choices.length:st.opts.length;
  const good=okIndex(st);
  for(let i=0;i<n;i++){
    const c=document.createElement('div'); c.className='gcard';
    if(gState==='done'){ c.classList.add('lock', i===good?'right':(i===gPicked?'picked':'dim')); }
    else if(gWrong.has(i)) c.classList.add('wrong','lock');
    c.innerHTML=badge(LETTERS[i])+'<div class="gbody"></div>';
    const body=c.querySelector('.gbody');
    box.appendChild(c);
    if(st.kind==='cmd'){
      const hold=document.createElement('div'); hold.className='bhold'; body.appendChild(hold);
      const el=makeStmt(st.cards[i].b(),false); hold.appendChild(el);
      const {w,h}=shapeStmt(el,COL.agent); hold.style.width=w+'px'; hold.style.height=(h+ND)+'px';
      if(st.cards[i].why){ const y=document.createElement('div'); y.className='why'; y.textContent='✖ '+st.cards[i].why; body.appendChild(y); }
    }else{
      const t=document.createElement('div'); t.className='gtxt';
      t.textContent=st.kind==='map'?'Клітинка '+LETTERS[i]:st.opts[i]; body.appendChild(t);
    }
    if(gState==='ask'&&!gWrong.has(i)) c.onclick=()=>gPick(i);
  }
}
function gPick(i){
  const st=G[gi];
  if(gBusy||gState!=='ask') return;
  if(st.kind==='cmd'&&!st.cards[i].ok){ gWrong.add(i); sShake(); renderCards(); return; }
  gPicked=i; gReveal();
}
function pandaRunsAway(){
  const start={x:6,y:7}, an=spawnAnimal(start);
  let p=pathOut(W.fences,start), i=1;
  const walk=()=>{ if(i<p.length){ moveAnimal(an,p[i++]); animalTimers.push(setTimeout(walk,380)); } };
  animalTimers.push(setTimeout(walk,700));
  sFail(); showMsg(ANIMALS.panda.gone,'warn');
}
function gReveal(){
  const st=G[gi];
  gBusy=true; renderGuided();
  const finish=()=>{
    gBusy=false; gState='done'; clearStepNums(); renderGuided();
    if(gPicked!=null&&st.kind!=='cmd'){ if(gPicked===okIndex(st)) sWin(); }
  };
  if(st.kind==='cmd'){
    const bl=lk([st.cards[okIndex(st)].b()]);
    program.push(...bl); flashIds.clear(); bl.forEach(b=>flashIds.add(b.id)); renderProgram();
    gLater(()=>{ flashIds.clear(); renderProgram(); },900);
    const go=()=>playBlocks(bl,STEP_MS,finish);
    if(st.chat) chatSay(go); else gLater(go,500);
  }else if(st.add){
    pendIds.clear(); flashIds.clear(); gBl.forEach(b=>flashIds.add(b.id)); renderProgram();
    gLater(()=>{ flashIds.clear(); renderProgram(); },900);
    gLater(()=>playBlocks(gBl,STEP_MS,finish),400);
  }else if(st.panda){
    built=true; releaseAnimals(); gLater(finish,1600);
  }else if(st.trap){
    const variant=lk(lessonProgram()).filter(b=>st.trap==='slot'?b.type!=='slot':!(b.type==='pl'&&b.on));
    W.silent=true; resetWorld(); W.silent=false; hideMsg();
    program=variant; renderProgram();
    showMsg(st.trap==='slot'?'Прибрали блок: постав паркан у слот 1':'Прибрали блок: розмістити на ходу УВІМКН.','info');
    gLater(()=>chatSay(()=>playBlocks(variant,320,()=>{ pandaRunsAway(); gLater(finish,1800); })),900);
  }
}
function showMemo(){
  completed.add(0); renderProgress();
  $('mTitle').textContent='📋 Схема: як агент будує загін';
  $('mText').innerHTML=`<div class="memo">
    <div class="mc"><div class="mh">① Покликати агента</div><div class="mb ev">при команді чату "1"</div><div class="mb">агент - телепортуватися до гравця</div></div>
    <div class="mc"><div class="mh">② Дати паркан</div><div class="mb">agent, постав блок або предмет паркан у слот 1</div></div>
    <div class="mc"><div class="mh">③ Показати шлях</div><div class="mb">розмістити на ходу УВІМКН.</div><div class="mt">4 сторони загону</div><div class="mb">розмістити на ходу ВИМКН.</div></div>
    <div class="mc"><div class="mh">④ Випустити тваринку</div><div class="mt">Тварина в загоні — все вийшло! 💚</div></div>
  </div>`;
  $('mGo').textContent='До рівня 2 ▶'; $('mStay').classList.remove('hidden');
  document.querySelector('.mbox').classList.add('wide');
  modalGo=()=>loadLevel(1); $('modal').classList.remove('hidden');
}
$('gMain').onclick=()=>{
  if(gBusy) return;
  if(gState==='ask'){ gPicked=null; gReveal(); }
  else if(gi<G.length-1) gGo(gi+1);
  else showMemo();
};
$('gBack').onclick=()=>{ if(gBusy) return; if(gState==='done') gGo(gi); else if(gi>0) gGo(gi-1); };
$('gRestart').onclick=()=>{ if(!gBusy) gGo(0); };

/* ================= старт ================= */
loadLevel(0);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{ renderPalette(); renderProgram(); });
})();
</script>
